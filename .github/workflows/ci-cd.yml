name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast test suite
        run: uv run pytest -q -m "not slow"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine whether publish is needed
        id: version_check
        run: |
          python <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from urllib.parse import quote
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          package_name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{quote(package_name)}/json"

          publish = False
          reason = ""

          try:
            with urllib.request.urlopen(url) as response:
              payload = json.load(response)
          except urllib.error.HTTPError as exc:
            if exc.code == 404:
              publish = True
              reason = f"{package_name} is not on PyPI yet"
            else:
              raise
          else:
            releases = payload.get("releases", {})
            if version not in releases:
              publish = True
              reason = f"{package_name} {version} is not on PyPI"
            else:
              reason = f"{package_name} {version} is already on PyPI"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"package_name={package_name}\n")
            fh.write(f"version={version}\n")
            fh.write(f"publish={'true' if publish else 'false'}\n")
            fh.write(f"reason={reason}\n")
          PY

      - name: Report publish decision
        run: |
          echo "Package: ${{ steps.version_check.outputs.package_name }}"
          echo "Version: ${{ steps.version_check.outputs.version }}"
          echo "Decision: ${{ steps.version_check.outputs.reason }}"

      - name: Install build frontend
        if: steps.version_check.outputs.publish == 'true'
        run: python -m pip install --upgrade build

      - name: Build package
        if: steps.version_check.outputs.publish == 'true'
        run: python -m build

      - name: Publish package
        if: steps.version_check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
